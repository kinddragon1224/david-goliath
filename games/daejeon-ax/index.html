<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#05061a" />
    <meta name="description" content="몸을 움직여 조종하는 3D 운석 피하기 — 대전 AX(Again eXpo) 2026" />
    <title>대전 AX(Again eXpo) 2026</title>
    <link rel="icon" href="data:," />
  </head>
  <body data-screen="loading">
    <canvas id="stage"></canvas>

    <!-- 카메라 미리보기: 캘리브레이션 때는 가운데 크게, 그 뒤로는 구석에 작게 -->
    <div id="camwrap" hidden>
      <video id="cam" playsinline muted autoplay></video>
      <canvas id="skeleton" width="160" height="120"></canvas>
      <svg id="guide" viewBox="0 0 100 100" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <circle cx="50" cy="34" r="15" />
        <path d="M14 100 C14 70 30 58 50 58 C70 58 86 70 86 100" />
      </svg>
    </div>

    <section class="screen" data-for="loading">
      <p class="brand">대전 AX 2026</p>
      <div class="bar"><i id="load-bar" style="width: 25%"></i></div>
      <p class="lead" id="load-text">불러오는 중…</p>
    </section>

    <section class="screen" data-for="title" hidden>
      <p class="best" id="title-best" hidden></p>
      <h1 class="logo" aria-label="대전 AX(Again eXpo) 2026">
        <b><span>대전 AX</span><span>2026</span></b>
        <small>Again eXpo</small>
      </h1>
      <p class="lead">몸을 움직여 운석을 피하세요!</p>
      <button class="btn" id="btn-start">시작</button>
      <!-- 다른 앱에서 ?home= 으로 들어왔을 때만 보인다 -->
      <button class="btn ghost small" id="btn-exit" hidden>체험 고르기로</button>
      <div id="qr">
        <div id="qr-code"></div>
        <p>스마트폰으로 플레이</p>
      </div>
      <!-- 제작사 표기: 로고, 홈페이지, 사업자등록번호 -->
      <div class="maker">
        <img src="/src/assets/brand/therumen.png" alt="THE RUMEN" width="900" height="214" />
        <a href="https://therumen.kr" target="_blank" rel="noopener">therumen.kr</a>
        <p>사업자등록번호 222-12-98053</p>
      </div>
    </section>

    <!-- 난이도: 가운데의 3D 캐릭터를 가리지 않게 제목은 위, 카드는 아래 -->
    <section class="screen menu select" data-for="select" hidden>
      <div class="head">
        <p class="lead" id="select-lead"></p>
        <h2>난이도를 골라 주세요</h2>
      </div>
      <!-- 카드는 game/config/presets.ts 의 PRESETS 로 만든다 -->
      <div class="cards" id="choices"></div>
    </section>

    <!-- 조종 방식: 몸(카메라) 또는 손(키보드·터치·기울기) -->
    <section class="screen menu" data-for="permission" hidden>
      <h2>어떻게 조종할까요?</h2>
      <p class="notice" id="cam-notice" hidden></p>
      <div class="cards">
        <button class="card" id="btn-camera" data-tone="sky">
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="32" cy="15" r="7" />
            <path d="M20 54c0-13 5-20 12-20s12 7 12 20" />
            <path d="M13 31l-7 6 7 6M51 31l7 6-7 6" />
          </svg>
          <strong>몸으로 조종</strong>
          <span class="desc">카메라 앞에서 좌우로 움직여요</span>
          <span class="meta">1~2m 떨어져 상반신이 보이게 서 주세요</span>
        </button>
        <button class="card" id="btn-nocam">
          <svg class="for-keys" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="4" y="19" width="26" height="26" rx="6" />
            <rect x="34" y="19" width="26" height="26" rx="6" />
            <path d="M23 32H11m5-5l-5 5 5 5M41 32h12m-5-5l5 5-5 5" />
          </svg>
          <svg class="for-touch" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="20" y="7" width="24" height="50" rx="6" />
            <circle cx="32" cy="34" r="4" />
            <path d="M13 34H4m4-5l-5 5 5 5M51 34h9m-4-5l5 5-5 5" />
          </svg>
          <strong id="manual-title"></strong>
          <span class="desc" id="manual-desc"></span>
          <span class="meta" id="manual-meta"></span>
        </button>
      </div>
      <p class="privacy">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2" /><path d="M8 11V8a4 4 0 0 1 8 0v3" /></svg>
        카메라 영상은 이 기기 안에서만 처리되며 어디에도 전송·저장되지 않습니다.
      </p>
    </section>

    <section class="screen menu calibrate" data-for="calibrate" hidden>
      <div class="head">
        <h2>화면 가운데 서 주세요</h2>
        <p class="lead" id="cal-status">카메라를 켜는 중…</p>
      </div>
      <div class="cal-bottom">
        <div class="bar"><i id="cal-bar"></i></div>
        <button class="btn ghost small" id="btn-skip"></button>
      </div>
    </section>

    <section class="screen" data-for="countdown" hidden>
      <p id="count">3</p>
      <p class="lead" id="how"></p>
    </section>

    <section class="screen hud" data-for="play" hidden>
      <div class="hud-left">
        <span id="hud-lives" aria-label="목숨"></span>
        <span id="hud-gauge" aria-label="피버 게이지"><i id="hud-gauge-fill"></i></span>
      </div>
      <div id="hud-score">
        <span id="hud-score-value" aria-label="점수">0</span>
        <small id="hud-stage" aria-label="여행지"></small>
        <small id="hud-power" aria-label="능력"></small>
      </div>
      <div class="hud-right">
        <span id="hud-time" aria-label="시간">0:00</span>
        <small id="hud-combo" aria-label="연속 회피"></small>
      </div>
    </section>
    <!-- 스테이지가 바뀔 때 잠깐 뜨는 안내 -->
    <div id="stage-banner" hidden><small id="stage-no"></small><strong id="stage-name"></strong><span id="stage-hint"></span></div>
    <div id="pause" hidden><p id="pause-text"></p></div>

    <section class="screen" data-for="result" hidden>
      <!-- 뒤의 3D 장면 위에서도 글자가 읽히게 짙은 판에 올린다 -->
      <div class="sheet">
      <h2 id="res-title">게임 종료</h2>
      <p class="lead" id="res-stage"></p>
      <p class="score"><span id="res-score">0</span><small>점</small></p>
      <p class="new" id="res-new" hidden>최고 기록!</p>
      <!-- 지나온 여행지마다 번호 스탬프 하나 -->
      <div id="res-stamps" aria-label="관광 스탬프"></div>
      <dl>
        <div><dt>생존 시간</dt><dd id="res-time">0:00</dd></div>
        <div><dt>관광 스탬프</dt><dd id="res-stampcount"></dd></div>
        <div id="res-foods-row"><dt>먹은 음식</dt><dd id="res-foods"></dd></div>
        <div><dt>난이도</dt><dd id="res-level"></dd></div>
        <div><dt>최고 기록</dt><dd id="res-best">0점</dd></div>
      </dl>
      </div>
      <div class="row">
        <button class="btn" id="btn-retry">다시 하기</button>
        <button class="btn ghost" id="btn-home">처음으로</button>
      </div>
    </section>

    <button id="btn-back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg>뒤로
    </button>

    <!-- 구석 도구: 꺼져 있으면 흐리게 보인다 -->
    <div id="tools">
      <button id="btn-cam" aria-label="카메라 미리보기 켜기/끄기" title="카메라 미리보기" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h4l2-3h6l2 3h4v11H3z" /><circle cx="12" cy="13" r="3.5" /></svg>
      </button>
      <button id="btn-fx" aria-label="효과 줄이기 켜기/끄기" title="효과 줄이기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 3l1.8 5.2L17 10l-5.2 1.8L10 17l-1.8-5.2L3 10l5.2-1.8zM18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9z" /></svg>
      </button>
      <button id="btn-mute" aria-label="소리 켜기/끄기" title="소리">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" /><path class="cross" d="M16.5 9.5l5 5m0-5l-5 5" /></svg>
      </button>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
